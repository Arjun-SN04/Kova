services:
  backend:
    build: .
    container_name: kova-backend
    restart: unless-stopped
    env_file:
      # raw: keep values exactly as written (no $ expansion inside passwords/keys)
      - path: .env
        format: raw
    environment:
      - PORT=3000
      - NODE_ENV=production
    # Only reachable through nginx on the same machine, never directly from the internet
    ports:
      - "127.0.0.1:3000:3000"
    # The free VM has 1 GB RAM shared with AniFlix, so keep Node's heap in check
    command: ["node", "--max-old-space-size=320", "index.js"]
    deploy:
      resources:
        limits:
          memory: 400M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
