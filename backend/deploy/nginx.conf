# Kova backend: nginx in front of the Docker container on 127.0.0.1:3000.
# __DOMAIN__ is replaced by deploy.sh. certbot adds the HTTPS parts.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # Uploads go up to 10 MB (Cloudinary free plan); leave some room for the form data
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Socket.IO needs the WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep idle sockets and slow AI replies open
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
